syntax = "proto3";

package rpcbench;

message ResultCode {
    int32 errcode = 1;
    string errmsg = 2;
}

message LoginRequest {
    string name = 1;
    string pwd = 2;
}

message LoginResponse {
    ResultCode result = 1;
    bool success = 2;
}

service UserService {
    rpc Login(LoginRequest) returns (LoginResponse);
}
